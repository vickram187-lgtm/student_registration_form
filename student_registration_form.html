<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 2 - Student Registration Form</title>
    <!-- Tailwind CSS for utility styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
        }
        /* Custom styled focus rings and validation states */
        input:focus, select:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.3);
        }
        input:invalid:touched {
            border-color: #ef4444;
        }
    </style>
</head>
<body class="flex items-center justify-center p-4 sm:p-6 md:p-10">

    <div class="w-full max-w-2xl bg-white rounded-2xl shadow-xl border border-gray-100 overflow-hidden transition-all duration-300 hover:shadow-2xl">
        <!-- Header Banner -->
        <div class="bg-indigo-600 px-6 py-6 sm:px-8 text-white">
            <h2 class="text-2xl sm:text-3xl font-bold tracking-tight">Student Registration</h2>
            <p class="text-indigo-100 text-sm sm:text-base mt-1">Experiment 2: Interactive HTML5 Form Controls & Validation</p>
        </div>

        <div class="p-6 sm:p-8">
            <!-- Form Start -->
            <form id="registrationForm" onsubmit="handleFormSubmit(event)" novalidate class="space-y-6">
                
                <!-- Full Name -->
                <div>
                    <label for="fullName" class="block text-sm font-semibold text-gray-700 mb-1">
                        Full Name <span class="text-red-500">*</span>
                    </label>
                    <input 
                        type="text" 
                        id="fullName" 
                        name="fullName" 
                        placeholder="John Doe" 
                        required 
                        minlength="3" 
                        maxlength="50"
                        class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-gray-800 placeholder-gray-400 focus:border-indigo-500 transition-colors"
                    >
                    <p class="text-xs text-gray-500 mt-1">3 to 50 characters required.</p>
                </div>

                <!-- Email Address & Mobile Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Email Address -->
                    <div>
                        <label for="email" class="block text-sm font-semibold text-gray-700 mb-1">
                            Email Address <span class="text-red-500">*</span>
                        </label>
                        <input 
                            type="email" 
                            id="email" 
                            name="email" 
                            placeholder="student@example.com" 
                            required
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-gray-800 placeholder-gray-400 focus:border-indigo-500 transition-colors"
                        >
                    </div>

                    <!-- Mobile Number -->
                    <div>
                        <label for="mobile" class="block text-sm font-semibold text-gray-700 mb-1">
                            Mobile Number <span class="text-red-500">*</span>
                        </label>
                        <input 
                            type="tel" 
                            id="mobile" 
                            name="mobile" 
                            placeholder="9876543210" 
                            pattern="[0-9]{10}" 
                            maxlength="10"
                            required
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-gray-800 placeholder-gray-400 focus:border-indigo-500 transition-colors"
                        >
                        <p class="text-xs text-gray-500 mt-1">Must be exactly 10 digits.</p>
                    </div>
                </div>

                <!-- Date of Birth & Gender Grid -->
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-6">
                    <!-- Date Picker (Date of Birth) -->
                    <div>
                        <label for="dob" class="block text-sm font-semibold text-gray-700 mb-1">
                            Date of Birth <span class="text-red-500">*</span>
                        </label>
                        <input 
                            type="date" 
                            id="dob" 
                            name="dob" 
                            max="2012-12-31" 
                            required
                            class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-gray-800 focus:border-indigo-500 transition-colors"
                        >
                    </div>

                    <!-- Gender Radio Buttons -->
                    <div>
                        <label class="block text-sm font-semibold text-gray-700 mb-2">
                            Gender <span class="text-red-500">*</span>
                        </label>
                        <div class="flex items-center space-x-4 pt-1">
                            <label class="inline-flex items-center text-gray-700 font-medium cursor-pointer">
                                <input type="radio" name="gender" value="Male" required class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-gray-300">
                                <span class="ml-2 text-sm">Male</span>
                            </label>
                            <label class="inline-flex items-center text-gray-700 font-medium cursor-pointer">
                                <input type="radio" name="gender" value="Female" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-gray-300">
                                <span class="ml-2 text-sm">Female</span>
                            </label>
                            <label class="inline-flex items-center text-gray-700 font-medium cursor-pointer">
                                <input type="radio" name="gender" value="Other" class="w-4 h-4 text-indigo-600 focus:ring-indigo-500 border-gray-300">
                                <span class="ml-2 text-sm">Other</span>
                            </label>
                        </div>
                    </div>
                </div>

                <!-- Dropdown (Course Selection) -->
                <div>
                    <label for="course" class="block text-sm font-semibold text-gray-700 mb-1">
                        Course Selection <span class="text-red-500">*</span>
                    </label>
                    <select id="course" name="course" required class="w-full px-4 py-2.5 rounded-lg border border-gray-300 text-gray-800 focus:border-indigo-500 transition-colors bg-white">
                        <option value="" disabled selected>-- Select a Course --</option>
                        <option value="B.Tech - Computer Science">B.Tech - Computer Science</option>
                        <option value="B.Tech - Information Technology">B.Tech - Information Technology</option>
                        <option value="B.Tech - Electronics & Communication">B.Tech - Electronics & Communication</option>
                        <option value="B.Tech - Mechanical Engineering">B.Tech - Mechanical Engineering</option>
                        <option value="B.Tech - Civil Engineering">B.Tech - Civil Engineering</option>
                    </select>
                </div>

                <!-- Checkboxes (Areas of Interest) -->
                <div>
                    <label class="block text-sm font-semibold text-gray-700 mb-2">
                        Areas of Interest (Optional)
                    </label>
                    <div class="grid grid-cols-2 sm:grid-cols-4 gap-3">
                        <label class="inline-flex items-center p-2 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer transition-colors">
                            <input type="checkbox" name="interests" value="Web Development" class="w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="ml-2 text-xs sm:text-sm text-gray-700">Web Dev</span>
                        </label>
                        <label class="inline-flex items-center p-2 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer transition-colors">
                            <input type="checkbox" name="interests" value="AI & Machine Learning" class="w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="ml-2 text-xs sm:text-sm text-gray-700">AI / ML</span>
                        </label>
                        <label class="inline-flex items-center p-2 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer transition-colors">
                            <input type="checkbox" name="interests" value="Cyber Security" class="w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="ml-2 text-xs sm:text-sm text-gray-700">Cyber Sec</span>
                        </label>
                        <label class="inline-flex items-center p-2 rounded-lg border border-gray-200 hover:bg-gray-50 cursor-pointer transition-colors">
                            <input type="checkbox" name="interests" value="Mobile Apps" class="w-4 h-4 text-indigo-600 rounded border-gray-300">
                            <span class="ml-2 text-xs sm:text-sm text-gray-700">App Dev</span>
                        </label>
                    </div>
                </div>

                <!-- Custom Error Box -->
                <div id="errorBox" class="hidden p-4 rounded-lg bg-red-50 border border-red-200 text-red-700 text-sm font-medium"></div>

                <!-- Action Buttons -->
                <div class="flex items-center space-x-4 pt-2">
                    <button 
                        type="submit" 
                        class="flex-1 bg-indigo-600 hover:bg-indigo-700 text-white font-semibold py-3 px-6 rounded-lg transition-colors shadow-md hover:shadow-lg focus:outline-none"
                    >
                        Submit Registration
                    </button>
                    <button 
                        type="button" 
                        onclick="resetForm()" 
                        class="px-6 py-3 bg-gray-100 hover:bg-gray-200 text-gray-700 font-semibold rounded-lg transition-colors focus:outline-none"
                    >
                        Reset
                    </button>
                </div>

            </form>

            <!-- Confirmation Message Area -->
            <div id="confirmationCard" class="hidden mt-8 p-6 bg-emerald-50 border border-emerald-200 rounded-xl">
                <div class="flex items-center mb-4">
                    <svg class="w-6 h-6 text-emerald-600 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path>
                    </svg>
                    <h3 class="text-lg font-bold text-emerald-800">Registration Successful!</h3>
                </div>
                <p class="text-xs text-emerald-600 mb-4">Here are the details you submitted:</p>

                <div class="space-y-2 text-sm text-gray-700 bg-white p-4 rounded-lg border border-emerald-100 shadow-sm">
                    <div class="flex justify-between border-b pb-1"><span class="font-semibold text-gray-500">Full Name:</span> <span id="resName" class="font-medium"></span></div>
                    <div class="flex justify-between border-b pb-1"><span class="font-semibold text-gray-500">Email Address:</span> <span id="resEmail" class="font-medium"></span></div>
                    <div class="flex justify-between border-b pb-1"><span class="font-semibold text-gray-500">Mobile Number:</span> <span id="resMobile" class="font-medium"></span></div>
                    <div class="flex justify-between border-b pb-1"><span class="font-semibold text-gray-500">Date of Birth:</span> <span id="resDob" class="font-medium"></span></div>
                    <div class="flex justify-between border-b pb-1"><span class="font-semibold text-gray-500">Gender:</span> <span id="resGender" class="font-medium"></span></div>
                    <div class="flex justify-between border-b pb-1"><span class="font-semibold text-gray-500">Course:</span> <span id="resCourse" class="font-medium"></span></div>
                    <div class="flex justify-between"><span class="font-semibold text-gray-500">Interests:</span> <span id="resInterests" class="font-medium"></span></div>
                </div>
            </div>

        </div>
    </div>

    <script>
        function handleFormSubmit(event) {
            event.preventDefault();

            const form = document.getElementById('registrationForm');
            const errorBox = document.getElementById('errorBox');
            const confirmationCard = document.getElementById('confirmationCard');

            errorBox.classList.add('hidden');
            errorBox.innerHTML = '';

            // Input fields
            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const mobile = document.getElementById('mobile').value.trim();
            const dob = document.getElementById('dob').value;
            const course = document.getElementById('course').value;
            
            // Radio button value
            const genderNode = document.querySelector('input[name="gender"]:checked');
            const gender = genderNode ? genderNode.value : '';

            // Checkbox values
            const interestNodes = document.querySelectorAll('input[name="interests"]:checked');
            const interests = Array.from(interestNodes).map(cb => cb.value);

            // JavaScript validation check matching HTML5 patterns
            const errors = [];

            if (!fullName || fullName.length < 3) {
                errors.push('Full Name must be at least 3 characters long.');
            }

            const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
            if (!email || !emailRegex.test(email)) {
                errors.push('Please enter a valid email address.');
            }

            const mobileRegex = /^[0-9]{10}$/;
            if (!mobile || !mobileRegex.test(mobile)) {
                errors.push('Mobile number must be exactly 10 numeric digits.');
            }

            if (!dob) {
                errors.push('Please select your Date of Birth.');
            }

            if (!gender) {
                errors.push('Please select your gender.');
            }

            if (!course) {
                errors.push('Please select a course.');
            }

            // Display errors if any exist
            if (errors.length > 0) {
                errorBox.innerHTML = '<ul class="list-disc pl-5 space-y-1">' + errors.map(err => `<li>${err}</li>`).join('') + '</ul>';
                errorBox.classList.remove('hidden');
                confirmationCard.classList.add('hidden');
                return;
            }

            // Display confirmation with submitted values
            document.getElementById('resName').textContent = fullName;
            document.getElementById('resEmail').textContent = email;
            document.getElementById('resMobile').textContent = mobile;
            document.getElementById('resDob').textContent = dob;
            document.getElementById('resGender').textContent = gender;
            document.getElementById('resCourse').textContent = course;
            document.getElementById('resInterests').textContent = interests.length > 0 ? interests.join(', ') : 'None specified';

            confirmationCard.classList.remove('hidden');
            confirmationCard.scrollIntoView({ behavior: 'smooth' });
        }

        function resetForm() {
            document.getElementById('registrationForm').reset();
            document.getElementById('errorBox').classList.add('hidden');
            document.getElementById('confirmationCard').classList.add('hidden');
        }
    </script>
</body>
</html>
